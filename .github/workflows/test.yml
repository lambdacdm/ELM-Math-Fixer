name: Test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Syntax and metadata checks
        run: npm run check

      - name: Install Chromium for browser tests
        run: npx playwright-core install chromium --with-deps

      - name: Run browser tests
        run: |
          export CHROME_PATH=$(find "$HOME/.cache/ms-playwright" -type f -name chrome | head -1)
          npm test
